name: pipeline

on:
  schedule:
    - cron: '17 3 * * 1'   # weekly snapshot, Monday 03:17 UTC
    - cron: '17 3 * * 4'   # Thursday: restore the state cache so it is not evicted (7 days without access)
  workflow_dispatch:
    inputs:
      source:
        description: 'Re-run one source id only (other sources keep their last published results); empty = all'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore: ['snapshot/**', 'docs/**', 'spikes/**', '*.md']

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  test:
    if: github.event.schedule != '17 3 * * 4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  snapshot:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # State is derived from chain data only; a cache miss means one full rebuild run, not lost data.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: state, key: 'state-${{ github.run_id }}', restore-keys: 'state-' }
      - run: pnpm snapshot ${SOURCE:+--source "$SOURCE"}
        env:
          GEOMI_API_KEY: ${{ secrets.GEOMI_API_KEY }}
          SOURCE: ${{ inputs.source }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with: { path: state, key: 'state-${{ github.run_id }}' }
      # Committing the aggregate snapshot keeps a public history and counts as repo activity
      # (GitHub disables schedules after 60 days without it).
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%F)"
          # main can move during a long run; the snapshot file never conflicts with code commits.
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1

  keep-cache:
    if: github.event.schedule == '17 3 * * 4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: state, key: 'state-keepalive', restore-keys: 'state-' }

  deploy:
    needs: [test, snapshot]
    if: always() && needs.test.result == 'success' && needs.snapshot.result != 'failure' && needs.snapshot.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }   # includes the snapshot commit pushed by the job above
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test   # re-runs the boundary test against dist/
      - run: |
          pnpm exec wrangler pages project create hidden-funds-aptos --production-branch main || true
          pnpm exec wrangler pages deploy dist --project-name hidden-funds-aptos --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
