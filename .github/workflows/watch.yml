name: wind-down watch

# Weekly: flags protocols the registry treats as live whose public signals (DefiLlama dead mark, a steep TVL drop, a
# domain that no longer resolves) say they may be winding down, as one GitHub issue each (label wind-down-watch).
on:
  schedule:
    - cron: '47 4 * * 1'   # Monday 04:47 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # opens and updates the wind-down-watch issues

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
