name: preview

# Deploys a pull request's site to <branch>.move-lost-and-found.pages.dev. A workflow_run always runs main's copy of this
# file with main's dependencies, so no code from the PR runs next to the Cloudflare secrets: the PR only contributes
# the static files its pipeline run built (preview-build) and uploaded.
on:
  workflow_run:
    workflows: [pipeline]
    types: [completed]

permissions:
  contents: read
  actions: read          # download the PR run's artifact
  pull-requests: write   # preview link comment

# One deploy per branch at a time; a newer run replaces an older one, which would otherwise overwrite the alias and the
# comment with a stale build if it finished last.
concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }   # main, not the PR
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A later push already has (or will have) its own run: never deploy an older build over it.
      - id: current
        run: |
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          echo "ok=$([ "$head" = "$SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
      - if: steps.current.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: deploy
        if: steps.current.outputs.ok == 'true'
        run: |
          out=$(pnpm exec wrangler pages deploy preview --project-name move-lost-and-found --branch "$BRANCH")
          echo "$out"
          url=$(echo "$out" | grep -o 'https://[^ ]*pages.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.deploy.outputs.url != '' && github.event.workflow_run.pull_requests[0].number
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview: $URL (commit ${SHA:0:7})"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
